<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="MERIDIAN — forge autonomous trading agents and run them against real market data with virtual capital">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="0.55" stop-color="#0e1526"/>
      <stop offset="1" stop-color="#090d18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.16" r="0.8">
      <stop offset="0" stop-color="#c9a86a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#c9a86a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="iso" width="56" height="32" patternUnits="userSpaceOnUse" patternTransform="translate(0 6)">
      <path d="M0 16 L28 0 L56 16 L28 32 Z" fill="none" stroke="#c9a86a" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#iso)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <circle cx="1120" cy="330" r="180" fill="#c9a86a" opacity="0.03"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#c9a86a" stroke-opacity="0.25"/>

  <g>
    <!-- eyebrow -->
    <circle cx="60" cy="55" r="3.5" fill="#c9a86a"/>
    <text x="76" y="60" fill="#8a7348" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.2">AGENT TRADING SIMULATOR · REAL DATA, VIRTUAL CAPITAL</text>

    <!-- wordmark: Newsreader-style serif fallback -->
    <text x="56" y="152" fill="#e8eaf0" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="74" font-weight="600" letter-spacing="10">MERIDIAN</text>
    <line x1="60" y1="176" x2="640" y2="176" stroke="#c9a86a" stroke-opacity="0.35" stroke-width="1"/>

    <!-- sub-line -->
    <text x="60" y="212" fill="#e8eaf0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Forge a strategy, compile its stats into real engine</text>
    <text x="60" y="238" fill="#8b93a7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">parameters, and watch ten agents trade the market tape.</text>

    <!-- chips -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.6">
      <rect x="58" y="270" width="118" height="30" rx="8" fill="#c9a86a" fill-opacity="0.10" stroke="#c9a86a" stroke-opacity="0.35"/>
      <text x="76" y="290" fill="#c9a86a">TYPESCRIPT</text>

      <rect x="186" y="270" width="150" height="30" rx="8" fill="#c9a86a" fill-opacity="0.06" stroke="#c9a86a" stroke-opacity="0.22"/>
      <text x="204" y="290" fill="#8b93a7">REACT + VITE</text>

      <rect x="346" y="270" width="170" height="30" rx="8" fill="#c9a86a" fill-opacity="0.06" stroke="#c9a86a" stroke-opacity="0.22"/>
      <text x="364" y="290" fill="#8b93a7">226 TESTS</text>

      <rect x="526" y="270" width="110" height="30" rx="8" fill="#c9a86a" fill-opacity="0.06" stroke="#c9a86a" stroke-opacity="0.22"/>
      <text x="544" y="290" fill="#8b93a7">MIT</text>
    </g>

    <!-- right panel: what the modes actually are -->
    <rect x="790" y="58" width="352" height="224" rx="12" fill="#0a0f1c" fill-opacity="0.85" stroke="#c9a86a" stroke-opacity="0.28"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <text x="814" y="92" fill="#8a7348">&gt; sim</text>
      <text x="1118" y="92" fill="#e8eaf0" text-anchor="end">seeded offline world</text>

      <text x="814" y="124" fill="#8a7348">&gt; paper</text>
      <text x="1118" y="124" fill="#e8eaf0" text-anchor="end">real Coinbase quotes</text>

      <text x="814" y="156" fill="#8a7348">&gt; virtual book</text>
      <text x="1118" y="156" fill="#c9a86a" text-anchor="end">10 ETH · never real funds</text>

      <text x="814" y="188" fill="#8a7348">&gt; forge</text>
      <text x="1118" y="188" fill="#e8eaf0" text-anchor="end">20 stats → engine config</text>

      <text x="814" y="220" fill="#8a7348">&gt; agents</text>
      <text x="1118" y="220" fill="#e8eaf0" text-anchor="end">deterministic, no API keys</text>

      <text x="814" y="252" fill="#8a7348">&gt; money</text>
      <text x="1118" y="252" fill="#d97068" text-anchor="end">none touches this app</text>
    </g>
  </g>
</svg>
