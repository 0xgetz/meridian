<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="MERIDIAN logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#0e1526"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3c98f"/>
      <stop offset="0.5" stop-color="#c9a86a"/>
      <stop offset="1" stop-color="#8a7348"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="95" fill="none" stroke="#c9a86a" stroke-opacity="0.35" stroke-width="2"/>

  <!-- meridian ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#brass)" stroke-width="7"/>
  <ellipse cx="256" cy="256" rx="78" ry="168" fill="none" stroke="#c9a86a" stroke-opacity="0.45" stroke-width="4"/>
  <line x1="88" y1="256" x2="424" y2="256" stroke="#c9a86a" stroke-opacity="0.45" stroke-width="4"/>

  <!-- compass needle: north brass, south ink -->
  <path d="M256 104 L296 256 L256 288 L216 256 Z" fill="url(#brass)"/>
  <path d="M256 408 L296 256 L256 288 L216 256 Z" fill="#1b2745" stroke="#8b93a7" stroke-opacity="0.5" stroke-width="3"/>

  <!-- hub -->
  <circle cx="256" cy="256" r="17" fill="#0e1526" stroke="url(#brass)" stroke-width="6"/>

  <!-- cardinal ticks -->
  <g stroke="#c9a86a" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="52" x2="256" y2="76"/>
    <line x1="256" y1="436" x2="256" y2="460"/>
    <line x1="52" y1="256" x2="76" y2="256"/>
    <line x1="436" y1="256" x2="460" y2="256"/>
  </g>
</svg>
